# Überlagerung für die Dev-Instanz auf dem Dev-Server — aufgerufen von deploy/dev.sh, nicht von Hand:
#
#     deploy/dev.sh up
#
# Gebaut wird aus dem Arbeitsstand (compose.build.yaml), die Site bekommt einen eigenen
# Container-Namen (…-dev). Erreichbar unter https://dev.<APP_DOMAIN> über den Edge-Caddy — nur
# im Tailnet. Für schnelles Arbeiten an Inhalten genügt `npm run dev` im Terminal des Servers;
# die Dev-Instanz zeigt das gebaute Ergebnis so, wie es ausgeliefert wird.
#
# Auf dem Prod-Server hat diese Datei nichts verloren: Dort läuft nur ein Release (rollout).

services:
    app:
        container_name: {{NAME}}-dev-app
