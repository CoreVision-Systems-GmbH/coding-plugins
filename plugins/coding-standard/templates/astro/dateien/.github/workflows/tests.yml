name: tests

# Der verpflichtende Status-Check heißt `ci` (siehe Ruleset des Repos). Der
# Auftrag darf deshalb nicht umbenannt werden, ohne das Ruleset nachzuziehen.

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review: der PR-Text zählt spätestens, wenn der Draft fertig ist.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read   # Schritt „PR-Text prüfen“ liest den PR-Text

env:
  # Astro meldet Nutzung an den Hersteller, solange das nicht abgeschaltet ist.
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Volle Historie samt aller Zweige: gitleaks prüft bei einem PR die Spanne
          # origin/<basiszweig>..HEAD. Ein flacher Checkout kennt weder den Basiszweig noch
          # die Kette der PR-Commits — und ein späteres git fetch käme ohne Anmeldedaten
          # (persist-credentials: false) in ein privates Repo nicht hinein.
          fetch-depth: 0

      # Geheimnisse vor allem anderen: Zugangsdaten gehören nie ins Repo (Fehlermuster H).
      # Binary statt Marketplace-Action: gitleaks/gitleaks-action verlangt für Organisationen
      # eine Lizenz, das Binary nicht. Feste Fassung, Prüfsumme hier festgenagelt statt aus dem
      # Download (wer das Release tauscht, tauscht auch dessen Prüfsummendatei): Die Prüfung
      # ändert sich nicht über Nacht, ein vertauschtes Binary fällt auf. Beim
      # Anheben zuerst lokal prüfen (gitleaks dir .). Beide Läufe lesen .gitleaks.toml aus dem
      # Wurzelverzeichnis von selbst; jeder Treffer ist FAIL.
      - name: Geheimnisse (gitleaks)
        env:
          GITLEAKS_FASSUNG: 8.30.1
          # aus gitleaks_8.30.1_checksums.txt — hier festgenagelt, beim Anheben mitziehen
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASISZWEIG: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          quelle="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_FASSUNG"
          datei="gitleaks_${GITLEAKS_FASSUNG}_linux_x64.tar.gz"
          ziel="$RUNNER_TEMP/gitleaks"
          mkdir -p "$ziel"
          curl -fsSL "$quelle/$datei" -o "$ziel/$datei"
          echo "$GITLEAKS_SHA256  $ziel/$datei" | sha256sum -c -
          tar -xzf "$ziel/$datei" -C "$ziel" gitleaks
          # Arbeitsbaum: was jetzt im Repo liegt.
          "$ziel/gitleaks" dir . --no-banner --redact --exit-code 1
          # PR: dazu jeder einzelne Commit — ein Geheimnis, das der letzte Commit wieder
          # entfernt hat, steht sonst trotzdem in der Historie.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            "$ziel/gitleaks" git . --no-banner --redact --exit-code 1 --log-opts="origin/$BASISZWEIG..HEAD"
          fi

      # Der PR ist die Lieferung: Abnahmekriterien, Prüfweg, „Nicht geprüft“ und Rückweg müssen
      # im PR-Text stehen (Vorlage .github/pull_request_template.md, Prüfer scripts/pr-text-pruefen.sh).
      # Liest den aktuellen Text über gh, damit ein erneuter Lauf nach einer Textänderung zählt.
      - name: PR-Text prüfen
        # PR-Autor statt Auslöser: Pusht ein Mensch auf einen Dependabot-Zweig, bleibt der Text
        # Dependabots. shell: bash bringt pipefail — scheitert gh, ist das der Fehler, nicht
        # „PR-Text ist leer“.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMMER" --json body -q .body | bash scripts/pr-text-pruefen.sh

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      # Dieselben Schritte wie `npm run check`, einzeln benannt, damit die CI zeigt, wo es hakt.
      - name: Typen und Vorlagen
        run: npm run check:types

      # Der Bau ist die eigentliche Prüfung: Er scheitert bei Schemaverstößen
      # in Collections, fehlenden Bildern und fehlender `site`.
      - name: Bauen
        run: npm run build

      - name: Tests gegen dist/
        run: npm test

      # Kennzahlen je Funktion — bis Ende 2026 eine Warnung, ab 2027-01-01 ein Tor (Kern).
      - name: Kennzahlen je Funktion
        run: bash scripts/komplexitaet-pruefen.sh

      # Sichere Standardkonfiguration (Geheimnisse leer, Debug aus, nur index.php öffentlich) und
      # Lizenzen gegen die Allow-Liste — beides auch Teil von `check`.
      - name: Konfiguration
        run: bash scripts/konfig-pruefen.sh

      - name: Lizenzen
        run: bash scripts/lizenzen-pruefen.sh

      - name: Sicherheitshinweise der Abhängigkeiten
        run: npm audit --omit=dev --audit-level=high
