name: release

# Aus einem Tag `vX.Y.Z` entsteht das Abbild in GHCR — und nur daraus. Auf einem
# Kundenserver läuft nie ein selbst gebauter Stand und nie `latest`: In der
# `.env` der Instanz steht ein fester Kennsatz, den `deploy/update.sh` setzt.
#
# Der Digest wird an die Notizen des zugehörigen GitHub-Releases gehängt.
# Damit lässt sich später zweifelsfrei sagen, welches Abbild zu welcher
# Fassung gehört. Gibt es noch kein Release, wird eines mit dem Abschnitt aus
# CHANGES.md angelegt (scripts/release-notes.sh).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Der Kennsatz im Abbild trägt kein führendes "v" — er soll neben der
      # Fassung in CHANGES.md stehen können, nicht neben dem Git-Tag.
      - name: Fassung aus dem Tag ableiten
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kennsätze und Beschriftung bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Kein `latest`: Ein beweglicher Kennsatz wäre genau die ungeplante
          # Aktualisierung, die auf Kundensystemen nichts zu suchen hat.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-

      - name: Abbild bauen und hochladen
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_IMAGE_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Herkunftsnachweise verlangen einen Plan, den wir nicht haben, und
          # erzeugen sonst nur einen zweiten Eintrag je Abbild.
          provenance: false

      - name: Digest in die Release-Notizen schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Vorhandene Notizen behalten; einen früher angehängten
            # Abbild-Abschnitt abschneiden, damit ein zweiter Lauf ihn ersetzt
            # statt ihn zu verdoppeln.
            gh release view "$TAG" --json body --jq '.body' \
              | awk '/^## Abbild$/ { exit } { print }' > "$notes"
          else
            bash scripts/release-notes.sh "$VERSION" > "$notes"
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          fi

          {
            printf '\n## Abbild\n\n'
            printf 'Digest: `%s`\n\n' "$DIGEST"
            printf 'Kennsätze:\n\n'
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$notes"

          gh release edit "$TAG" --notes-file "$notes"
