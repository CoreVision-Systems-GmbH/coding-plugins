# Überlagerung für die Dev-Instanz auf dem Dev-Server — aufgerufen von deploy/dev.sh, nicht von Hand:
#
#     deploy/dev.sh up
#
# Gebaut wird aus dem Arbeitsstand (compose.build.yaml). Theme, Mu-Plugins und Konfiguration
# kommen direkt aus dem Arbeitsordner (Änderungen sofort sichtbar), Fehler erscheinen im Browser
# (WP_ENV=development, keine Indexierung). Eigene Container-Namen (…-dev) und über den
# Projektnamen eigene Volumes, also eine eigene Datenbank. Erreichbar unter
# https://dev.<APP_DOMAIN> über den Edge-Caddy — nur im Tailnet. In der .env der Dev-Instanz
# steht WP_HOME=https://dev.<APP_DOMAIN>.
#
# Erstinstallation der Dev-Site (einmal, nach dem ersten deploy/dev.sh up):
#
#     docker compose -p {{NAME}}-dev exec app sh -c 'wp core install --url="$WP_HOME" --title=Dev \
#         --admin_user=<name> --admin_email=<mail> --prompt=admin_password'
#
# (WP_HOME steht nur in der .env — deshalb wertet die Shell im Container ihn aus.)
#
# Auf dem Prod-Server hat diese Datei nichts verloren: Dort läuft nur ein Release (rollout).

services:
    app:
        container_name: {{NAME}}-dev-app
        environment:
            WP_ENV: development
        volumes:
            - ./web/app/themes/site:/app/web/app/themes/site
            - ./web/app/mu-plugins:/app/web/app/mu-plugins
            - ./config:/app/config
            - ./docker/php.dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

    cron:
        container_name: {{NAME}}-dev-cron
        environment:
            WP_ENV: development
        volumes:
            - ./web/app/mu-plugins:/app/web/app/mu-plugins
            - ./config:/app/config

    db:
        container_name: {{NAME}}-dev-db
