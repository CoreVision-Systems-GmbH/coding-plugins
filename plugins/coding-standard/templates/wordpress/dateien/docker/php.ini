; Laufzeiteinstellungen von WordPress.
; Uploads großzügig (Medienbibliothek), Skriptzeit für Importe. Wer mehr braucht,
; ändert es hier — nicht über ein Plugin.

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 120
max_input_vars = 3000

expose_php = Off
date.timezone = Europe/Vienna

; Fehler nach stderr (Container-Log), nie in den Browser.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 16
