name: claude-review

# Automatische Durchsicht jedes Pull Requests durch Claude.
#
# Zwei Handgriffe je Repository, einmalig:
#
#     claude setup-token
#     gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo {{OWNER}}/{{NAME}}
#     gh variable set CLAUDE_REVIEW_ENABLED --body true --repo {{OWNER}}/{{NAME}}
#
# Dazu muss die GitHub-App „Claude" Zugriff auf dieses Repository haben.
# Solange die Variable nicht auf "true" steht, wird der Auftrag übersprungen
# statt rot zu werden — ein fehlendes Geheimnis ist kein Fehler des Pull Requests.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  review:
    if: ${{ vars.CLAUDE_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Claude-Durchsicht
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
