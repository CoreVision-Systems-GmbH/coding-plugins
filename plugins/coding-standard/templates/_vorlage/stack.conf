# Stack-Register: <Name>
#
# Diese Datei macht einen Ordner unter templates/ zu einem Stack. Sie wird von
# scripts/projekt-neu.sh mit `source` gelesen — also reines bash, keine Befehle.
# Ordner, deren Name mit "_" beginnt, tauchen in --list-stacks nicht auf.

# Was in der Auswahl steht: Framework und Fassungen, eine Zeile.
LABEL="<Framework> <Fassung>"

# Wofür dieser Stack gedacht ist — hilft bei der Auswahl, ein Satz.
DESCRIPTION="<Art der Projekte, Datenhaltung, Lieferweg>"

# Werkzeuge, die vorhanden sein müssen, damit das Gerüst entstehen kann.
# Leer lassen, wenn keine gebraucht werden. Unter Windows werden auch
# <werkzeug>.bat und ~/.config/herd/bin/<werkzeug>.bat gefunden.
REQUIRES=""

# 1 = das Projekt wird als Abbild geliefert (Dockerfile, compose, deploy/,
#     release.yml gehören in dateien/). 0 = kein Abbild.
CONTAINERIZED=0

# 1 = der Stack hat keine Markerdatei, an der ihn der SessionStart-Hook
#     erkennen könnte. Dann schreibt der Bootstrap `.coding-standard` mit der
#     Zeile `stack: <name>` ins Projekt.
# 0 = der Hook erkennt den Stack selbst (Erkennungszeile in
#     hooks/standard-context.sh ergänzen, Fall in hooks/test-standard-context.sh).
MARKER=1

# Zieldatenbank samt Fassung, wie sie in der CLAUDE.md des Projekts steht — damit die KI
# keinen Dialekt rät. "keine", wenn der Stack ohne Datenbank auskommt.
DATABASE="<Datenbank und Fassung, oder keine>"
