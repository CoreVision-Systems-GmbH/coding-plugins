# Werkzeugkette von {{NAME}} — eine Konfiguration für Formatter, Linter,
# Typprüfung und Tests. Die Abhängigkeiten selbst stehen gepinnt in
# requirements.txt bzw. requirements-dev.txt.

[project]
name = "{{NAME_SNAKE}}"
version = "0.1.0"
description = "{{PURPOSE}}"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "S",   # bandit: Sicherheitsmuster
    "RUF",
]
ignore = [
    # FastAPI setzt Abhängigkeiten und Validierungen als Vorgabewerte im
    # Funktionskopf ein — genau das, was B008 anmahnt. Hier ist es das Muster
    # des Frameworks, kein Versehen.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# In Tests sind assert-Anweisungen der Zweck der Übung.
"tests/**" = ["S101"]

# Kennzahlen je Funktion (scripts/komplexitaet-pruefen.sh: C901, PLR0912, PLR0915) — bis Ende
# 2026 eine Warnung, ab 2027-01-01 ein Tor. Eine Funktion, die hier anschlägt, wird zerlegt.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# Mutationstest (nightly.yml): mutiert wird die Fachlogik in app/, nicht Router, Einstieg
# und Schemata — ein überlebender Mutant heißt, dass die Änderung kein Test bemerkt hätte.
# mutmut 3 braucht den ganzen Paketbaum als Quelle (es importiert aus mutants/app),
# deshalb source_paths = app mit Ausnahmen statt nur app/modules.
[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args_test_selection = ["tests"]
do_not_mutate = [
    "app/__init__.py",
    "app/main.py",
    "app/settings.py",
    "app/schemas.py",
    "app/modules/__init__.py",
    "app/modules/*/__init__.py",
    "app/modules/*/router.py",
]
