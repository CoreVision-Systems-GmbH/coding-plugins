# Betriebsverbund von {{NAME}}.
#
# Der Projektname ist gesetzt, damit Container- und Netznamen unabhängig vom
# Verzeichnisnamen stabil bleiben.
#
# Kein Port wird nach außen veröffentlicht: Der Edge-Caddy des Servers liegt
# im selben Netz `edge` und spricht den Anwendungscontainer über seinen Namen
# an. Alles Übrige hängt nur im internen Netz.
#
# Das Abbild wird nicht hier gebaut, sondern aus der Registry geladen: Der
# Release-Workflow baut es aus einem Tag nach GHCR, `APP_VERSION` in der .env
# der Instanz bestimmt, welcher Stand läuft. Geändert wird dieser Wert nur
# über deploy/update.sh — dann steht der Rückweg fest.
#
# Zum Bauen auf dem eigenen Rechner die Überlagerung dazunehmen:
#     APP_VERSION=local docker compose -f compose.yaml -f compose.build.yaml build

name: {{NAME}}

services:
    app:
        image: {{IMAGE}}:${APP_VERSION:?APP_VERSION fehlt in .env — Image-Tag der Instanz}
        container_name: {{NAME}}-app
        restart: unless-stopped
        env_file: .env
        volumes:
            - app_data:/data
        networks:
            - edge
            - internal
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/healthz']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 20s

    # Kommt eine echte Datenbank dazu, gehört sie hierher — ausschließlich im
    # internen Netz, mit Healthcheck und `depends_on: condition: service_healthy`
    # beim app-Dienst. Bis dahin liegen die Daten als Datei im Volume unter
    # DATA_DIR, und deploy/backup.sh sichert genau dieses Volume.

volumes:
    app_data:

networks:
    # Wird vom Edge-Proxy des Servers bereitgestellt und hier nur mitbenutzt.
    edge:
        external: true
    internal:
