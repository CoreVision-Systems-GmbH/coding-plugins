# Werkzeugkette von {{NAME}} — nur Konfiguration für Formatter, Linter und
# Tests. Es gibt kein Paket und keine Abhängigkeiten: Die Werkzeuge werden in
# der CI installiert, lokal nach Bedarf (pip install ruff pytest).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# In Tests sind assert-Anweisungen der Zweck der Übung.
"tests/**" = ["S101"]

# Kennzahlen je Funktion (scripts/komplexitaet-pruefen.sh: C901, PLR0912, PLR0915) — bis Ende
# 2026 eine Warnung, ab 2027-01-01 ein Tor. Eine Funktion, die hier anschlägt, wird zerlegt.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
