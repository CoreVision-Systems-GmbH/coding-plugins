; Laufzeiteinstellungen der Anwendung.
; Großzügig bemessen, damit Datei-Uploads und Importe nicht am Limit hängen.
; Wer mehr braucht, ändert es hier — nicht per ini_set im Code.

memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120

expose_php = Off
date.timezone = Europe/Vienna

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.interned_strings_buffer = 16
